  detail: 'Eliminate input.map(Array.from), eliminate per-sample postMessage. Worklet writes Float32 input directly into the SAB in region and reads output directly from the SAB out region. No Array allocation, no String marshalling, no structured clone. process() becomes: write block, Atomics.notify, read prior block (or wait briefly).'
